name: Rebuild 1.1.5 from pinned commit (reproducible-build fix)

# One-off rebuild of the 1.1.5 reference APK so it byte-matches what F-Droid
# builds from the pinned commit 98658696cd1915aa4bf1acb0e3a64d5f27919799.
# AGP embeds the git HEAD revision into META-INF/version-control-info.textproto,
# so the build MUST run with HEAD exactly on the pinned commit. The release
# signing config + Gradle heap fix (develop commits 1d6d91f and 777308d) are
# applied to the working tree WITHOUT committing, keeping HEAD on the pin.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to pinned commit, apply build-only changes uncommitted
        run: |
          set -eux
          git fetch origin develop
          git reset --hard 5a95d071c6b55aa9159def394ffc6cf2414dae1b
          # Apply ONLY the build-process diffs (signing config + Gradle heap),
          # not the workflow-file changes from those commits (this file is ours).
          git diff f7ac8d0b7a2412289bb76dc8dc911081faaa3e41 1d6d91f6e57f89affded9b36b0f971e25026eab4 -- app/build.gradle | git apply --index
          git diff 1d6d91f6e57f89affded9b36b0f971e25026eab4 777308d823082f231b9bb7d76bbd448d29d24ea5 -- gradle.properties | git apply --index
          git log -1 --format='HEAD=%H (must equal the fdroid/1.1.5 fix commit)'
          git status --short | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up permanent signing key
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta-keystore.p12"
          echo "BETA_KEYSTORE_FILE=$RUNNER_TEMP/beta-keystore.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build-output.log"
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: ${{ runner.temp }}/build-output.log

      - name: Verify APK for F-Droid
        run: |
          set -eux
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Verifying $APK"
          python3 - <<'EOF'
          import struct, sys, zipfile, glob
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          # 1) single dex, release build
          dexs = [n for n in names if n.endswith('.dex')]
          assert len(dexs) == 1, f"expected 1 dex, found {dexs}"
          # 2) no _DEBUG marker (must be a true release build)
          blob = b''.join(z.read(d) for d in dexs)
          assert b'_DEBUG' not in blob, "found _DEBUG marker"
          # 3) version-control-info embeds the exact fix commit
          vci = z.read('META-INF/version-control-info.textproto').decode()
          assert '5a95d071c6b55aa9159def394ffc6cf2414dae1b' in vci, f"wrong revision: {vci}"
          # 4) no Dependency metadata signing block (0x504b4453)
          data = open(apk, 'rb').read()
          magic = b'APK Sig Block 42'
          eocd = data.rfind(b'PK\x05\x06')
          cd_off = struct.unpack('<I', data[eocd+16:eocd+20])[0]
          ms = cd_off - 16
          assert data[ms:cd_off] == magic, "signing block magic not found"
          s2 = struct.unpack('<Q', data[ms-8:ms])[0]
          ss = ms - 8 - s2
          s1 = struct.unpack('<Q', data[ss:ss+8])[0]
          assert s1 == s2, "signing block size mismatch"
          pos, dep = ss + 8, False
          while pos < ms - 8:
              psz = struct.unpack('<Q', data[pos:pos+8])[0]
              bid = struct.unpack('<I', data[pos+8:pos+12])[0]
              print(f"signing sub-block 0x{bid:08x} ({psz} bytes)")
              if bid == 0x504B4453:
                  dep = True
              pos += 8 + psz
          assert not dep, "Dependency metadata block (0x504b4453) still present"
          print("ALL APK CHECKS PASSED")
          EOF

      - name: Verify signing certificate
        run: |
          set -eux
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | grep -q "79:D4:6B:B4:96:70:28:A4:22:50:D2:83:96:3C:68:3A:52:95:6C:72:D7:5D:DE:52:D1:BC:1E:6E:4B:D0:26:6A"

      - name: Replace v1.1.5 GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" tvmovie-tracker-1.1.5.apk
          gh release delete-asset v1.1.5 tvmovie-tracker-1.1.5.apk --repo steps2/tvmovietracker -y
          gh release upload v1.1.5 tvmovie-tracker-1.1.5.apk --repo steps2/tvmovietracker
          gh release view v1.1.5 --repo steps2/tvmovietracker --json assets --jq '.assets[].name'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvmovie-tracker-115-pinned-apk
          path: app/build/outputs/apk/release/*.apk

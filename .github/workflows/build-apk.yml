name: Rebuild 1.1.5 from pinned commit (reproducible-build fix)

# One-off rebuild of the 1.1.5 reference APK so it byte-matches what F-Droid
# builds from the pinned commit 98658696cd1915aa4bf1acb0e3a64d5f27919799.
# AGP embeds the git HEAD revision into META-INF/version-control-info.textproto,
# so the build MUST run with HEAD exactly on the pinned commit. The release
# signing config + Gradle heap fix (develop commits 1d6d91f and 777308d) are
# applied to the working tree WITHOUT committing, keeping HEAD on the pin.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to pinned commit, apply build-only changes uncommitted
        run: |
          set -eux
          git fetch origin develop
          git reset --hard 98658696cd1915aa4bf1acb0e3a64d5f27919799
          # Apply ONLY the build-process diffs (signing config + Gradle heap),
          # not the workflow-file changes from those commits (this file is ours).
          git diff f7ac8d0b7a2412289bb76dc8dc911081faaa3e41 1d6d91f6e57f89affded9b36b0f971e25026eab4 -- app/build.gradle | git apply --index
          git diff 1d6d91f6e57f89affded9b36b0f971e25026eab4 777308d823082f231b9bb7d76bbd448d29d24ea5 -- gradle.properties | git apply --index
          git log -1 --format='HEAD=%H (must equal the pinned commit)'
          git status --short | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up permanent signing key
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta-keystore.p12"
          echo "BETA_KEYSTORE_FILE=$RUNNER_TEMP/beta-keystore.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build-output.log"
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: ${{ runner.temp }}/build-output.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvmovie-tracker-115-pinned-apk
          path: app/build/outputs/apk/release/*.apk

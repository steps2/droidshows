apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "app.tvmovie.tracker"
        minSdkVersion 21 // required androidx appcompat 1.7 / material 1.13
        // minSdkVersion 14 // previous: migrated android 4.0 api 14 version
        targetSdkVersion 34
        compileSdkVersion 35

        // versionCode 71110     // original andoid 2.3 api 9 version
        // versionName "7.11.10" // original andoid 2.3 api 9 version
        versionCode 10105            // 1.1.5: repo rename link fixes (steps2/tvmovietracker)
        versionName "1.1.5"          // fresh numbering for the renamed app

        vectorDrawables.useSupportLibrary = true
    }
    signingConfigs {
        // Permanent beta signing key: when BETA_KEYSTORE_* env vars are present
        // (GitHub Actions), every build is signed with the same certificate so
        // betas install on top of each other. Falls back to the default debug
        // key when the env vars are absent (local builds).
        beta {
            storeFile file(System.getenv("BETA_KEYSTORE_FILE") ?: "debug.keystore")
            storePassword System.getenv("BETA_KEYSTORE_PASSWORD")
            keyAlias System.getenv("BETA_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("BETA_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            // used to allow different configurations between debung and release to protect production data
            buildConfigField 'String', 'CONFIG_SUFFIX', '""'

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // used to allow different configurations between debung and release to protect production data
            buildConfigField 'String', 'CONFIG_SUFFIX', '"_DEBUG"'

            // shrinkResources true
            // minifyEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // No applicationId/versionName suffixes: the debug build IS the
            // distributed build and must carry the clean package and version.

            // Use the permanent beta key when available so every CI build
            // carries the same signature and installs over previous betas.
            if (System.getenv("BETA_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.beta
            }
        }
    }
    namespace 'app.tvmovie.tracker'
    lint {
        abortOnError false
    }
    // F-Droid: drop the AGP "Dependency metadata" signing block (0x504b4453).
    // It is an encrypted, non-deterministic blob for Google Play's benefit and
    // F-Droid's "check apk" scanner rejects any APK carrying it. No app code
    // is affected; Play bundles keep their own copy via includeInBundle.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    //      implementation 'com.android.support:appcompat-v7:14.0.0'-- api 9 (Android 2.3)
    // 28.0.0 is the last non-androidx version required by androidx migrationswizzard
    // implementation 'com.android.support:appcompat-v7:28.0.0' // lint warn compileSdkVersion does not match lib version

    // def appcompat_version = "1.7.0" // most recent requires api 21
    // def appcompat_version = "1.0.0"
    def appcompat_version = "1.7.0" // requires api 21

    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.google.android.material:material:1.13.0'

    // implementation "androidx.recyclerview:recyclerview:1.4.0"
    // implementation "androidx.recyclerview:recyclerview:1.0.0" // not used yet
}
